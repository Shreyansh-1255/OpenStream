<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#100e0c">
<title>404 - Page not found | OpenStream</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 fill=%27%23100e0c%27/%3E%3Cg transform=%27translate(4.8 4.8) scale(0.6)%27 fill=%27none%27 stroke=%27%23cda24e%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27%3E%3Cpath d=%27M3 3h18v18H3z%27/%3E%3Cpath d=%27M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4%27/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@700&display=swap">
<script>
/* same saved theme as the app (os_theme), applied before first paint */
try { if (localStorage.getItem('os_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
</script>
<style>
:root{--bg:#100e0c;--surface:#1b1712;--line:#322b21;--text:#f1e9d8;--muted:#8f8471;--gold:#cda24e;--on-gold:#100e0c;color-scheme:dark}
:root[data-theme="light"]{--bg:#f3ecdc;--surface:#faf5e8;--line:#ddd1b6;--text:#2b2318;--muted:#6e624d;--gold:#8f6212;--on-gold:#faf5e8;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;
  padding-top:max(24px,env(safe-area-inset-top,0px));padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  background-image:radial-gradient(ellipse at 50% 0%,rgba(205,162,78,.14),transparent 60%)}
.card{width:100%;max-width:420px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:36px 24px 32px}
.logo{width:56px;height:56px;margin:0 auto 18px;color:var(--gold)}
.code{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:84px;line-height:1;color:var(--gold);letter-spacing:2px}
h1{font-size:22px;font-weight:700;margin:14px 0 8px}
p{color:var(--muted);font-size:15px;line-height:1.55;margin-bottom:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:12px;
  background:var(--gold);color:var(--on-gold);font-weight:700;font-size:16px;text-decoration:none}
.btn:active{transform:scale(.98)}
.brand{margin-top:22px;font-size:13px;color:var(--muted);letter-spacing:.4px}
</style>
</head>
<body>
<main class="card">
  <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v18H3z"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/></svg>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you are looking for doesn't exist, or the link may be wrong.</p>
  <a class="btn" href="/">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    Back to home
  </a>
  <div class="brand">OpenStream</div>
</main>
</body>
</html>
